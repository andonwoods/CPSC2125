<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap 5 Assignment</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="bg-primary text-white text-center p-4">
    <h1>My Bootstrap 5 Assignment</h1>
  </header>

  <!-- Nav Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Home</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="https://www.google.com">Google</a></li>
          <li class="nav-item"><a class="nav-link" href="https://www.wikipedia.org">Wikipedia</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main 1: Table -->
  <section class="container my-5">
    <h2 class="mb-4">Main Section 1: Table</h2>
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>Column 1</th>
            <th>Column 2</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Purpose</td><td>Defines the goal of the project</td></tr>
          <tr><td>Scope</td><td>Outlines the boundaries of work</td></tr>
          <tr><td>Definitions</td><td>Clarifies important terms</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Main 2: Carousel -->
  <section class="container my-5">
    <h2 class="mb-4">Main Section 2: Image Carousel</h2>
    <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="images/img1.jpg" class="d-block w-100" alt="Image 1">
        </div>
        <div class="carousel-item">
          <img src="images/img2.jpg" class="d-block w-100" alt="Image 2">
        </div>
        <div class="carousel-item">
          <img src="images/img3.jpg" class="d-block w-100" alt="Image 3">
        </div>
        <div class="carousel-item">
          <img src="images/img4.jpg" class="d-block w-100" alt="Image 4">
        </div>
        <div class="carousel-item">
          <img src="images/img5.jpg" class="d-block w-100" alt="Image 5">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-secondary text-white text-center p-3">
    <p>&copy; 2025 My Bootstrap Assignment</p>
  </footer>

</body>
</html>
