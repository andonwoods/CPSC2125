<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }
    nav {
      margin-bottom: 20px;
    }
    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #007BFF;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    input[type="radio"],
    input[type="checkbox"] {
      width: auto;
    }
    input[type="submit"],
    input[type="reset"] {
      width: 48%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
    }
    input[type="submit"] {
      background-color: #28a745;
    }
    input[type="reset"] {
      background-color: #dc3545;
    }
    fieldset {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 15px;
    }
    legend {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="register.html">Register</a>
  </nav>

  <h1>Register</h1>

  <form action="https://formspree.io/f/myzkjveq" method="POST">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="fullname" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password">

    <label for="color">Favorite Color:</label>
    <input type="color" id="color" name="color">

    <label for="file">Upload a File:</label>
    <input type="file" id="file" name="file">

    <label>Choose a Plan:</label>
    <input type="radio" id="basic" name="plan" value="Basic">
    <label for="basic">Basic</label>
    <input type="radio" id="premium" name="plan" value="Premium">
    <label for="premium">Premium</label>

    <label for="range">Satisfaction Level:</label>
    <input type="range" id="range" name="satisfaction" min="0" max="10">

    <label>
      <input type="checkbox" name="subscribe"> Subscribe to newsletter
    </label>

    <label for="comments">Comments:</label>
    <textarea id="comments" name="comments" rows="4"></textarea>

    <label for="country">Select Country:</label>
    <select id="country" name="country">
      <option value="usa">USA</option>
      <option value="canada">Canada</option>
      <option value="uk">UK</option>
    </select>

    <fieldset>
      <legend>Extra Info</legend>
      <label for="nickname">Nickname:</label>
      <input type="text" id="nickname" name="nickname">
    </fieldset>

    <input type="reset" value="Reset">
    <input type="submit" value="Submit">
  </form>

</body>
</html>
